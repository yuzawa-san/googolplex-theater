name: build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # NOTE: https://github.com/actions/runner-images/issues/10924
        # baseline + latest
        java: [ '26' ]
        os: ['ubuntu-latest', 'macos-14', 'windows-latest']
        include:
          - java: 17
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.os }} on Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: |
          ./gradlew --no-daemon -s build
      - name: Upload coverage to Codecov
        # skip minimum version
        if: ${{ matrix.java != '17' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: java-${{ matrix.java }}-${{ matrix.os }}
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "build/test-results/test/TEST-*.xml"
        if: always()
      - name: Save reports
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: reports-${{ matrix.os }}-${{ matrix.java }}
          path: build/reports/
